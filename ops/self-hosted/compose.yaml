name: hashpass-ops-edge
services:
  caddy:
    image: caddy:2.10.2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    env_file: .env
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      # Outside the rsync-managed runtime root, so a deploy never deletes the published page.
      - /opt/hashpass/status:/srv/status:ro
      - caddy_data:/data
      - caddy_config:/config
    networks: [ops]
    healthcheck:
      test: ["CMD", "caddy", "validate", "--config", "/etc/caddy/Caddyfile"]
      interval: 30s
      timeout: 5s
      retries: 3
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "5"}
networks:
  ops:
    name: hashpass-ops
    external: true
volumes:
  caddy_data:
  caddy_config:
