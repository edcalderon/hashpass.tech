<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">LUKAS stable value for LatAm payments</title>
  <desc id="desc">LUKAS stable value for LatAm payments, powered by HashPass.</desc>
  <defs>
    <linearGradient id="coin" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFF1B8"/>
      <stop offset=".45" stop-color="#F4C95D"/>
      <stop offset="1" stop-color="#B87A18"/>
    </linearGradient>
    <filter id="shadow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="22" stdDeviation="18" flood-color="#000000" flood-opacity=".42"/>
    </filter>
  </defs>
  <rect width="1200" height="630" fill="#050816"/>
  <circle cx="295" cy="310" r="360" fill="#12333A" opacity=".7"/>
  <path d="M-40 550C190 500 230 600 440 555S760 490 1240 545" fill="none" stroke="#35C66B" stroke-opacity=".12" stroke-width="2"/>
  <path d="M-40 592C190 542 230 642 440 597S760 532 1240 587" fill="none" stroke="#F4C95D" stroke-opacity=".12" stroke-width="2"/>

  <g filter="url(#shadow)">
    <circle cx="265" cy="315" r="164" fill="#050816" stroke="#FFE7A3" stroke-width="8"/>
    <circle cx="265" cy="315" r="143" fill="url(#coin)" stroke="#FFE7A3" stroke-opacity=".65" stroke-width="3"/>
    <circle cx="265" cy="315" r="122" fill="none" stroke="#8A5914" stroke-opacity=".55" stroke-width="3"/>
    <circle cx="265" cy="315" r="110" fill="none" stroke="#FFF1B8" stroke-opacity=".55" stroke-width="2" stroke-dasharray="2 13"/>
    <path d="M182 230h166M182 400h166" stroke="#8A5914" stroke-opacity=".5" stroke-width="3" stroke-linecap="round"/>
    <text x="265" y="350" text-anchor="middle" fill="#FFFDF2" font-family="DejaVu Sans,Arial,sans-serif" font-size="96" font-weight="bold">$L</text>
    <circle cx="359" cy="208" r="8" fill="#35C66B"/>
  </g>

  <g font-family="DejaVu Sans,Arial,sans-serif">
    <text x="525" y="178" fill="#F4C95D" font-size="28" font-weight="bold" letter-spacing="8">LUKAS</text>
    <text x="525" y="255" fill="#F8FAFC" font-size="54" font-weight="bold">Stable value</text>
    <text x="525" y="324" fill="#F8FAFC" font-size="54" font-weight="bold">for LatAm payments.</text>
    <text x="525" y="407" fill="#A7F3D0" font-size="27" font-weight="bold">1 LUKAS = 1 Peso LatAm</text>
    <text x="525" y="474" fill="#CBD5E1" font-size="20">Powered by HashPass · Omnichain · Built for real payments</text>
  </g>
</svg>
