AWSTemplateFormatVersion: '2010-09-09'
Description: Isolated least-privilege GitHub deployment role; no build compute resources.
Parameters:
  GitHubEnvironment:
    Type: String
    AllowedValues: [cbweek-development, bsl-development, bsl-production, production]
  SiteBucket:
    Type: String
  DistributionId:
    Type: String
    Default: ''
  LambdaFunction:
    Type: String
    Default: ''
Conditions:
  HasDistribution: !Not [!Equals [!Ref DistributionId, '']]
  HasLambda: !Not [!Equals [!Ref LambdaFunction, '']]
Resources:
  DeployRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub hashpass-${GitHubEnvironment}-site-github-actions
      MaxSessionDuration: 3600
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Federated: !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:oidc-provider/token.actions.githubusercontent.com
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
                token.actions.githubusercontent.com:sub: !Sub repo:hashpass-tech/hashpass.tech:environment:${GitHubEnvironment}
      Policies:
        - PolicyName: DeployOnlyThisSite
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: [s3:GetObject, s3:PutObject, s3:DeleteObject, s3:AbortMultipartUpload, s3:ListMultipartUploadParts]
                Resource: !Sub arn:${AWS::Partition}:s3:::${SiteBucket}/*
              - Effect: Allow
                Action: [s3:GetBucketLocation, s3:ListBucket, s3:ListBucketMultipartUploads]
                Resource: !Sub arn:${AWS::Partition}:s3:::${SiteBucket}
              - !If
                - HasDistribution
                - Effect: Allow
                  Action: cloudfront:CreateInvalidation
                  Resource: !Sub arn:${AWS::Partition}:cloudfront::${AWS::AccountId}:distribution/${DistributionId}
                - !Ref AWS::NoValue
              - !If
                - HasLambda
                - Effect: Allow
                  Action: [lambda:GetFunction, lambda:GetFunctionConfiguration, lambda:UpdateFunctionCode]
                  Resource: !Sub arn:${AWS::Partition}:lambda:us-east-1:${AWS::AccountId}:function:${LambdaFunction}
                - !Ref AWS::NoValue
      Tags:
        - Key: Project
          Value: hashpass
        - Key: Service
          Value: static-site-deployment
        - Key: Environment
          Value: !Ref GitHubEnvironment
Outputs:
  RoleArn:
    Value: !GetAtt DeployRole.Arn
