version: 0.2

env:
  shell: bash
  variables:
    PNPM_STORE_DIR: .pnpm-store

cache:
  key: pnpm-$(codebuild-hash-files pnpm-lock.yaml pnpm-workspace.yaml)
  paths:
    - .pnpm-store/**/*

phases:
  install:
    runtime-versions:
      nodejs: 22
    commands:
      - corepack enable
      - export PNPM_VERSION="$(node packages/tools/scripts/resolve-pnpm-version.js)"
      - corepack prepare pnpm@${PNPM_VERSION} --activate
      - pnpm config set store-dir ${PNPM_STORE_DIR}
  build:
    commands:
      - bash "${BUILD_SCRIPT_PATH}"
      - if [[ "${DEPLOY_MODE}" == "direct" ]]; then bash "${DEPLOY_SCRIPT_PATH}"; fi

artifacts:
  base-directory: ${SITE_BUILD_DIR}
  files:
    - '**/*'
