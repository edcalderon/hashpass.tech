name: HashPass Web Pipeline Monitor
run-name: HashPass Web Pipeline Monitor - ${{ github.ref_name }}

on:
  push:
    branches:
      - main
      - develop
    paths:
      - "apps/mobile-app/**"
      - "packages/auth/**"
      - "packages/config/**"
      - "packages/infra/terraform/modules/aws_pipeline_ec2_worker/**"
      - "packages/infra/terraform/modules/aws_static_site_pipeline/**"
      - "packages/infra/terraform/stacks/hashpass-web/**"
      - "packages/infra/terraform/stacks/bsl-target/**"
      - "packages/tools/scripts/build-static-site.sh"
      - "packages/tools/scripts/deploy-api-lambda.sh"
      - "packages/tools/scripts/deploy-static-site.sh"
      - "packages/tools/scripts/manage-web-pipeline-worker.sh"
      - "packages/tools/scripts/package-lambda.sh"
      - "packages/types/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - ".github/workflows/hashpass-web-pipeline-monitor.yml"
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
    inputs:
      aws_web_pipeline_role_arn:
        description: Optional IAM role ARN override for manual dispatch
        required: false
        type: string
      mode:
        description: Monitor the pipelines or run the idle stop check only
        required: true
        default: monitor
        type: choice
        options:
          - monitor
          - stop

concurrency:
  group: hashpass-web-pipeline-worker
  cancel-in-progress: false

jobs:
  monitor:
    if: github.repository == 'hashpass-tech/hashpass.tech'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      AWS_REGION: ${{ vars.AWS_WEB_PIPELINE_REGION || 'us-east-2' }}
      AWS_WEB_PIPELINE_ROLE_ARN: ${{ vars.AWS_WEB_PIPELINE_ROLE_ARN || inputs.aws_web_pipeline_role_arn }}
      WEB_PIPELINE_NAMES: ${{ vars.WEB_PIPELINE_NAMES || 'hashpass-dev-site,hashpass-production-site' }}
      WEB_PIPELINE_PROJECT_TAG: ${{ vars.WEB_PIPELINE_PROJECT_TAG || 'hashpass' }}
      WEB_PIPELINE_SERVICE_TAG: ${{ vars.WEB_PIPELINE_SERVICE_TAG || 'pipeline-build-worker' }}
      WEB_PIPELINE_PROVIDER_TAGS: ${{ vars.WEB_PIPELINE_PROVIDER_TAGS || 'hashpass-prod-ec2-build,hashpass-dev-ec2-build' }}
      BSL_PIPELINE_NAMES: ${{ vars.BSL_PIPELINE_NAMES || 'bsl-hashpass-dev,bsl-hashpass-prod' }}
      BSL_PIPELINE_PROVIDER_TAGS: ${{ vars.BSL_PIPELINE_PROVIDER_TAGS || 'hashpass-bsl-prod-ec2-build,hashpass-bsl-dev-ec2-build' }}
      ACTIVE_WEB_PIPELINE_NAME: ${{ github.ref == 'refs/heads/main' && 'hashpass-production-site' || 'hashpass-dev-site' }}
      ACTIVE_WEB_PROVIDER_TAG: ${{ github.ref == 'refs/heads/main' && 'hashpass-prod-ec2-build' || 'hashpass-dev-ec2-build' }}
      ACTIVE_BSL_PIPELINE_NAME: ${{ github.ref == 'refs/heads/main' && 'bsl-hashpass-prod' || 'bsl-hashpass-dev' }}
      ACTIVE_BSL_PROVIDER_TAG: ${{ github.ref == 'refs/heads/main' && 'hashpass-bsl-prod-ec2-build' || 'hashpass-bsl-dev-ec2-build' }}
      WEB_PIPELINE_GRACE_SECONDS: ${{ vars.WEB_PIPELINE_GRACE_SECONDS || '30' }}
      WEB_PIPELINE_START_WAIT_SECONDS: ${{ vars.WEB_PIPELINE_START_WAIT_SECONDS || '180' }}
      WEB_PIPELINE_POLL_SECONDS: ${{ vars.WEB_PIPELINE_POLL_SECONDS || '20' }}
      WEB_PIPELINE_ORPHAN_GRACE_SECONDS: ${{ vars.WEB_PIPELINE_ORPHAN_GRACE_SECONDS || '600' }}
      # Persistent EC2 workers are cost-sensitive. Starts require a deliberate
      # repository-variable opt-in; the idle stop sweep remains active always.
      WEB_PIPELINE_WORKER_AUTOSTART_ENABLED: ${{ vars.WEB_PIPELINE_WORKER_AUTOSTART_ENABLED || 'false' }}
      BSL_PIPELINE_WORKER_AUTOSTART_ENABLED: ${{ vars.BSL_PIPELINE_WORKER_AUTOSTART_ENABLED || 'false' }}
      WEB_PIPELINE_MODE: ${{ github.event_name == 'schedule' && 'stop' || github.event_name == 'workflow_dispatch' && inputs.mode || 'monitor' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          clean: false

      - name: Validate AWS control role
        run: |
          set -euo pipefail

          if [ -z "${AWS_WEB_PIPELINE_ROLE_ARN:-}" ]; then
            echo "Missing AWS_WEB_PIPELINE_ROLE_ARN. Set the GitHub repo variable or pass workflow_dispatch input aws_web_pipeline_role_arn."
            exit 1
          fi

      - name: Configure AWS credentials (OIDC)
        id: configure-aws
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_WEB_PIPELINE_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: hashpass-web-pipeline-monitor

      - name: Monitor web pipelines and worker
        if: env.WEB_PIPELINE_MODE == 'monitor' && env.WEB_PIPELINE_WORKER_AUTOSTART_ENABLED == 'true' && steps.configure-aws.outcome == 'success'
        run: |
          set -euo pipefail
          packages/tools/scripts/manage-web-pipeline-worker.sh \
            --mode monitor \
            --pipelines "${ACTIVE_WEB_PIPELINE_NAME}" \
            --project-tag "${WEB_PIPELINE_PROJECT_TAG}" \
            --service-tag "${WEB_PIPELINE_SERVICE_TAG}" \
            --provider-tag "${ACTIVE_WEB_PROVIDER_TAG}" \
            --region "${AWS_REGION}" \
            --grace-seconds "${WEB_PIPELINE_GRACE_SECONDS}" \
            --start-wait-seconds "${WEB_PIPELINE_START_WAIT_SECONDS}" \
            --poll-seconds "${WEB_PIPELINE_POLL_SECONDS}"

      - name: Monitor active BSL pipeline and worker
        if: env.WEB_PIPELINE_MODE == 'monitor' && env.BSL_PIPELINE_WORKER_AUTOSTART_ENABLED == 'true' && steps.configure-aws.outcome == 'success'
        run: |
          set -euo pipefail
          packages/tools/scripts/manage-web-pipeline-worker.sh \
            --mode monitor \
            --pipelines "${ACTIVE_BSL_PIPELINE_NAME}" \
            --project-tag "${WEB_PIPELINE_PROJECT_TAG}" \
            --service-tag "${WEB_PIPELINE_SERVICE_TAG}" \
            --provider-tag "${ACTIVE_BSL_PROVIDER_TAG}" \
            --region "${AWS_REGION}" \
            --grace-seconds "${WEB_PIPELINE_GRACE_SECONDS}" \
            --start-wait-seconds "${WEB_PIPELINE_START_WAIT_SECONDS}" \
            --poll-seconds "${WEB_PIPELINE_POLL_SECONDS}"

      - name: Stop web worker if idle
        if: always() && steps.configure-aws.outcome == 'success'
        run: |
          set -euo pipefail
          packages/tools/scripts/manage-web-pipeline-worker.sh \
            --mode stop \
            --pipelines "${WEB_PIPELINE_NAMES}" \
            --project-tag "${WEB_PIPELINE_PROJECT_TAG}" \
            --service-tag "${WEB_PIPELINE_SERVICE_TAG}" \
            --provider-tag "${WEB_PIPELINE_PROVIDER_TAGS}" \
            --region "${AWS_REGION}" \
            --grace-seconds 0 \
            --poll-seconds "${WEB_PIPELINE_POLL_SECONDS}"

      - name: Stop BSL workers if idle
        # BSL has its own dev/prod pipelines. It was excluded from the original
        # web-only sweep, leaving idle BSL workers running indefinitely. Do not
        # run this from a push: CodePipeline may not have registered the new
        # execution yet, and stopping during that window can strand a build.
        if: (github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.mode == 'stop')) && steps.configure-aws.outcome == 'success'
        run: |
          set -euo pipefail
          packages/tools/scripts/manage-web-pipeline-worker.sh \
            --mode stop \
            --pipelines "${BSL_PIPELINE_NAMES}" \
            --project-tag "${WEB_PIPELINE_PROJECT_TAG}" \
            --service-tag "${WEB_PIPELINE_SERVICE_TAG}" \
            --provider-tag "${BSL_PIPELINE_PROVIDER_TAGS}" \
            --region "${AWS_REGION}" \
            --grace-seconds 0 \
            --poll-seconds "${WEB_PIPELINE_POLL_SECONDS}"

      - name: Reconcile orphaned legacy EC2 actions
        # Native CodeBuild actions are ignored. This remains as a safety net
        # for an explicitly selected EC2 rollback: if CodePipeline is waiting
        # on a custom action and no matching worker is running, abandon it
        # after the grace period instead of allowing a 24-hour queue/hang.
        if: (github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.mode == 'stop')) && steps.configure-aws.outcome == 'success'
        run: |
          set -euo pipefail
          packages/tools/scripts/manage-web-pipeline-worker.sh \
            --mode reconcile \
            --pipelines "${WEB_PIPELINE_NAMES}" \
            --project-tag "${WEB_PIPELINE_PROJECT_TAG}" \
            --service-tag "${WEB_PIPELINE_SERVICE_TAG}" \
            --provider-tag "${WEB_PIPELINE_PROVIDER_TAGS}" \
            --region "${AWS_REGION}" \
            --orphan-grace-seconds "${WEB_PIPELINE_ORPHAN_GRACE_SECONDS}"
          packages/tools/scripts/manage-web-pipeline-worker.sh \
            --mode reconcile \
            --pipelines "${BSL_PIPELINE_NAMES}" \
            --project-tag "${WEB_PIPELINE_PROJECT_TAG}" \
            --service-tag "${WEB_PIPELINE_SERVICE_TAG}" \
            --provider-tag "${BSL_PIPELINE_PROVIDER_TAGS}" \
            --region "${AWS_REGION}" \
            --orphan-grace-seconds "${WEB_PIPELINE_ORPHAN_GRACE_SECONDS}"
