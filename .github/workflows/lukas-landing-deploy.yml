name: Lukas landing build and deploy

# The Lukas hostname is a standalone S3/CloudFront site. The protected release
# workflow calls this reusable workflow before creating a production tag, so a
# release cannot be tagged until the exact versioned Lukas artifact is live.
on:
  workflow_call:
    inputs:
      ref:
        description: Git ref or commit to build and publish
        required: true
        type: string
      mode:
        description: Release publication or manual recovery
        required: false
        default: release
        type: string
  workflow_dispatch:
    inputs:
      ref:
        description: Current main ref to recover (historical tags are unsupported)
        required: true
        default: main
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: production
    concurrency:
      group: lukas-landing-production
      cancel-in-progress: false
    env:
      LUKAS_SITE_BUCKET: hashpass-lukas-landing-site
      LUKAS_SITE_URL: https://lukas.hashpass.tech
      AWS_REGION: us-east-2
      LUKAS_BUILD_DIR: ${{ runner.temp }}/lukas-site
    steps:
      - name: Checkout release ref
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Read and validate release version
        id: version
        env:
          REF_NAME: ${{ inputs.ref }}
          MODE: ${{ inputs.mode }}
        run: |
          set -euo pipefail
          package_version=$(node -p "require('./package.json').version")
          if [[ "${MODE}" == "release" ]]; then
            if [[ ! "${REF_NAME}" =~ ^[0-9a-f]{40}$ ]]; then
              echo "::error::Release publication must use the merge commit SHA, received ${REF_NAME}."
              exit 1
            fi
          else
            case "${REF_NAME}" in
              main|refs/heads/main)
                ;;
              v*|refs/tags/v*)
                echo "::error::Manual Lukas recovery supports main only; historical release tags do not include the current deployment tooling."
                exit 1
                ;;
              *)
                echo "::error::Manual Lukas recovery must use main, received ${REF_NAME}."
                exit 1
                ;;
            esac
          fi
          echo "release_version=${package_version}" >> "$GITHUB_OUTPUT"
          echo "Lukas release version: ${package_version}"

      - name: Fetch pinned Lukas source
        env:
          LUKAS_SOURCE_REPOSITORY: https://github.com/edcalderon/hashpass.tech.git
          LUKAS_SOURCE_COMMIT: 1133ab564f9e8a589bc49f02c3c95b67f177b096
        run: |
          set -euo pipefail
          if ! git cat-file -e "${LUKAS_SOURCE_COMMIT}^{commit}" 2>/dev/null; then
            git fetch --no-tags --depth=1 "${LUKAS_SOURCE_REPOSITORY}" "${LUKAS_SOURCE_COMMIT}" || \
              git fetch --no-tags "${LUKAS_SOURCE_REPOSITORY}" refs/heads/lukas
          fi
          git cat-file -e "${LUKAS_SOURCE_COMMIT}^{commit}" || {
            echo "::error::Pinned Lukas source ${LUKAS_SOURCE_COMMIT} is unavailable after fetching ${LUKAS_SOURCE_REPOSITORY}."
            exit 1
          }

      - name: Build the versioned Lukas export
        env:
          LUKAS_RELEASE_VERSION: ${{ steps.version.outputs.release_version }}
        run: |
          set -euo pipefail
          python3 packages/infra/terraform/stacks/hashpass-lukas-site/build.py "${LUKAS_BUILD_DIR}"

      - name: Validate deployment role configuration
        env:
          ROLE_ARN: ${{ vars.AWS_INFRA_DEPLOY_ROLE_ARN }}
          EXPECTED_ACCOUNT: ${{ vars.AWS_TARGET_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          [[ -n "${ROLE_ARN}" ]] || {
            echo "::error::AWS_INFRA_DEPLOY_ROLE_ARN is not configured for the production environment."
            exit 1
          }
          [[ -n "${EXPECTED_ACCOUNT}" ]] || {
            echo "::error::AWS_TARGET_ACCOUNT_ID is not configured for the production environment."
            exit 1
          }

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_INFRA_DEPLOY_ROLE_ARN }}
          allowed-account-ids: ${{ vars.AWS_TARGET_ACCOUNT_ID }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: hashpass-lukas-release-${{ steps.version.outputs.release_version }}
          mask-aws-account-id: true

      - name: Publish and verify Lukas landing
        env:
          LUKAS_RELEASE_VERSION: ${{ steps.version.outputs.release_version }}
        run: bash packages/tools/scripts/deploy-lukas-landing.sh

      - name: Record deployment evidence
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.release_version }}
        run: |
          {
            echo "## Lukas landing deployment"
            echo
            echo "- Release: \`${RELEASE_VERSION}\`"
            echo "- Commit: \`${GITHUB_SHA}\`"
            echo "- URL: https://lukas.hashpass.tech/lukas"
            echo "- Artifact version: verified from recovery.json"
            echo "- Favicon: verified at /favicon.svg"
          } >> "$GITHUB_STEP_SUMMARY"
