name: Release tag on merge

# Fires after a develop -> main promotion PR merges. The version bump and
# changelog now happen inside that PR itself (packages/tools/scripts/
# release.js's --promote path runs the same bump machinery release:patch
# used to run on main, and commits it as its own labeled commit before the
# PR opens) — so by the time this workflow runs, the merge commit on main
# already has the final, reviewed version in package.json. This job's only
# jobs are: publish the exact Lukas artifact and verify it live, tag that exact
# commit, and sync develop to match -- a plain fast-forward when possible,
# falling back to a real (content-empty) merge when the PR was squash- or
# rebase-merged, since main's new commit then isn't a descendant of develop
# and a fast-forward push is correctly rejected. That fallback was added 2026-08-14 after two consecutive real
# failures (v1.8.341, v1.8.342) from squash-merging this PR -- see the
# "Sync develop from main" step below for the recovery logic, which mirrors
# the manual fix used both times.
#
# See .agents/active/task-release-flow-automation.md for the full design
# and the security considerations behind each piece below. In short:
# - Tags github.event.pull_request.merge_commit_sha, never a live branch
#   ref read at execution time, so a second merge landing in the gap
#   between the trigger firing and this job starting can't cause the wrong
#   commit to get tagged.
# - concurrency guards against a duplicate run tagging twice for one PR —
#   the same bug class that produced a duplicate mobile-android-release.yml
#   dispatch on 2026-07-13.
# - actions/checkout is pinned by commit SHA (not just the v4 tag other
#   workflows in this repo use) because this workflow can push directly to
#   main's tag namespace and to develop — a higher bar than most workflows
#   here, deliberately.
# - Only pushes the tag to origin, not upstream (the personal-fork backup
#   remote) — that remote lives under a different GitHub account, so no
#   token available here can authenticate to it anyway. Re-sync upstream
#   manually if needed, same as CLAUDE.md already documents elsewhere.
# - It listens to the post-merge push on main, rather than pull_request:
#   closed, so the production environment sees refs/heads/main instead of
#   refs/pull/*/merge and applies its normal branch protection rules.
# - On failure, comments on the merged PR directly (where a human will
#   actually look) rather than relying on the Actions tab status alone.
#
# IMPORTANT — why this uses a PAT, not the default GITHUB_TOKEN:
# GitHub does not let pushes made with the default GITHUB_TOKEN trigger
# other workflows' `on: push` listeners (anti-recursion protection). If the
# tag push here used the default token, mobile-release-on-tag.yml's
# `push: tags: v*.*.*` trigger would silently never fire, and the same for
# infra-deploy.yml's `push: branches: [develop]` trigger on the sync push
# below — breaking exactly the automation this task exists to keep working.
# RELEASE_AUTOMATION_TOKEN must be a fine-grained PAT scoped to only this
# repository with only the "Contents: Read and write" permission (no
# broader account-wide PAT) — see the task file for setup steps. Without
# this secret configured, the preflight step below fails loudly instead of
# silently falling back to a token whose pushes wouldn't cascade.

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write
  id-token: write

concurrency:
  # A unique group per main commit prevents duplicate delivery for one
  # release without replacing a different release that is already pending.
  group: release-tag-on-merge-${{ github.sha }}
  cancel-in-progress: false

jobs:
  resolve-promotion:
    if: github.repository == 'hashpass-tech/hashpass.tech'
    runs-on: ubuntu-latest
    outputs:
      is_promotion: ${{ steps.resolve.outputs.is_promotion }}
      merge_sha: ${{ steps.resolve.outputs.merge_sha }}
      pr_number: ${{ steps.resolve.outputs.pr_number }}
    steps:
      - name: Resolve merged promotion PR
        id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          promotion_prs=$(gh api \
            "repos/${GITHUB_REPOSITORY}/commits/${COMMIT_SHA}/pulls" \
            -H 'Accept: application/vnd.github+json' \
            --jq '[.[] | select(.merged_at != null and .base.ref == "main" and .head.ref == "develop")] | sort_by(.merged_at)')

          if [[ "$(jq 'length' <<<"${promotion_prs}")" == "0" ]]; then
            echo "is_promotion=false" >> "$GITHUB_OUTPUT"
            echo "Main commit ${COMMIT_SHA} is not a merged develop promotion; nothing to release."
            exit 0
          fi

          promotion_pr=$(jq '.[-1]' <<<"${promotion_prs}")
          merge_sha=$(jq -r '.merge_commit_sha' <<<"${promotion_pr}")
          pr_number=$(jq -r '.number' <<<"${promotion_pr}")

          if [[ "${merge_sha}" != "${COMMIT_SHA}" ]]; then
            echo "::error::The associated promotion PR does not point at the pushed main commit."
            exit 1
          fi

          {
            echo "is_promotion=true"
            echo "merge_sha=${merge_sha}"
            echo "pr_number=${pr_number}"
          } >> "$GITHUB_OUTPUT"
          echo "Resolved merged develop promotion PR #${pr_number}."

  publish-lukas:
    needs: resolve-promotion
    if: needs.resolve-promotion.outputs.is_promotion == 'true'
    uses: ./.github/workflows/lukas-landing-deploy.yml
    with:
      ref: ${{ needs.resolve-promotion.outputs.merge_sha }}
      mode: release

  tag-and-sync:
    needs: [resolve-promotion, publish-lukas]
    if: >
      needs.resolve-promotion.outputs.is_promotion == 'true' &&
      needs.publish-lukas.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Preflight — require RELEASE_AUTOMATION_TOKEN
        env:
          TOKEN_SET: ${{ secrets.RELEASE_AUTOMATION_TOKEN != '' }}
        run: |
          set -euo pipefail
          if [ "${TOKEN_SET}" != "true" ]; then
            echo "::error::RELEASE_AUTOMATION_TOKEN secret is not configured. A fine-grained PAT scoped to this repo (Contents: Read and write) is required so the tag/develop-sync pushes below can trigger downstream workflows — the default GITHUB_TOKEN cannot do this (GitHub's anti-recursion rule). See .agents/active/task-release-flow-automation.md."
            exit 1
          fi

      - name: Checkout merge commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ needs.resolve-promotion.outputs.merge_sha }}
          fetch-depth: 0
          token: ${{ secrets.RELEASE_AUTOMATION_TOKEN }}

      - name: Read release version
        id: version
        run: |
          set -euo pipefail
          VERSION=$(node -p "require('./package.json').version")
          if [ -z "$VERSION" ]; then
            echo "::error::Could not read version from package.json at the merge commit."
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Guard against re-tagging an existing version
        run: |
          set -euo pipefail
          if git rev-parse "refs/tags/v${{ steps.version.outputs.version }}" >/dev/null 2>&1; then
            echo "::error::Tag v${{ steps.version.outputs.version }} already exists. Refusing to move or duplicate it — if this PR's version bump is wrong, fix package.json and re-promote instead of re-running this job."
            exit 1
          fi

      - name: Create and push release tag
        env:
          MERGE_SHA: ${{ needs.resolve-promotion.outputs.merge_sha }}
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "v${RELEASE_VERSION}" -m "Version ${RELEASE_VERSION}" "${MERGE_SHA}"
          git push origin "v${RELEASE_VERSION}"

      - name: Sync develop from main
        env:
          MERGE_SHA: ${{ needs.resolve-promotion.outputs.merge_sha }}
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Fast path: works when the merge commit is a direct descendant of
          # develop -- true for a regular ("Create a merge commit") PR
          # merge, whose second parent is develop's tip. This is a plain
          # fast-forward, so it's a no-op push if it's not applicable.
          if git push origin "${MERGE_SHA}:refs/heads/develop"; then
            echo "Fast-forwarded develop to ${MERGE_SHA}."
            exit 0
          fi

          # Fallback: this repo allows squash and rebase merges too (see
          # repo settings), and either produces a main commit with different
          # ancestry than develop -- the fast-forward push above is then
          # correctly rejected as non-fast-forward. Reproduces the manual
          # recovery already needed twice for real (v1.8.341, v1.8.342 on
          # 2026-08-14): merge main's tip into develop instead of forcing it.
          # Since a squash/rebase merge's tree is byte-identical to
          # develop's pre-merge tip (same source branch, same diff), this
          # merge is content-empty and never conflicts -- it only exists to
          # give develop an ancestry path that includes main's tip.
          echo "Fast-forward rejected (squash/rebase merge) -- falling back to a real merge."
          git fetch origin develop
          git checkout -B develop origin/develop
          git merge --no-edit "${MERGE_SHA}" \
            -m "🔀 merge: sync develop with main (v${RELEASE_VERSION})"
          git push origin develop

  notify-on-failure:
    needs: [resolve-promotion, publish-lukas, tag-and-sync]
    if: >
      always() &&
      (
        needs.resolve-promotion.result == 'failure' ||
        (
          needs.resolve-promotion.outputs.is_promotion == 'true' &&
          (needs.publish-lukas.result == 'failure' || needs.tag-and-sync.result == 'failure')
        )
      )
    runs-on: ubuntu-latest
    steps:
      - name: Notify on failure
        env:
          GH_TOKEN: ${{ github.token }}
          RESOLUTION_RESULT: ${{ needs.resolve-promotion.result }}
          RESOLVED_PR_NUMBER: ${{ needs.resolve-promotion.outputs.pr_number }}
          COMMIT_SHA: ${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail

          pr_number="${RESOLVED_PR_NUMBER}"
          if [[ -z "${pr_number}" && "${RESOLUTION_RESULT}" == "failure" ]]; then
            for attempt in 1 2 3; do
              promotion_prs=$(gh api \
                "repos/${GITHUB_REPOSITORY}/commits/${COMMIT_SHA}/pulls" \
                -H 'Accept: application/vnd.github+json' \
                --jq '[.[] | select(.merged_at != null and .base.ref == "main" and .head.ref == "develop")] | sort_by(.merged_at)' \
                2>/dev/null || true)
              promotion_prs=${promotion_prs:-[]}
              pr_number=$(jq -r '.[-1].number // empty' <<<"${promotion_prs}")
              [[ -n "${pr_number}" ]] && break
              [[ "${attempt}" == "3" ]] || sleep 5
            done
          fi

          if [[ -n "${pr_number}" ]]; then
            if [[ "${RESOLUTION_RESULT}" == "failure" ]]; then
              body="⚠️ release-tag-on-merge could not resolve the merged promotion PR for commit ${COMMIT_SHA}; Lukas publication, release tagging, and develop sync did not run. Manual follow-up is required. Failed run: ${RUN_URL}"
            else
              body="⚠️ release-tag-on-merge failed after this PR merged — the Lukas publication, release tag, and/or develop sync may be incomplete. Manual follow-up needed. Failed run: ${RUN_URL}"
            fi
            gh pr comment "${pr_number}" \
              --repo hashpass-tech/hashpass.tech \
              --body "${body}"
          else
            echo "::error::release-tag-on-merge failed before it could resolve the affected promotion PR for commit ${COMMIT_SHA}."
            {
              echo "## Release automation failure"
              echo
              echo "Promotion resolution failed for commit \`${COMMIT_SHA}\`. No affected PR could be resolved for an automatic comment."
              echo "Failed run: ${RUN_URL}"
            } >> "$GITHUB_STEP_SUMMARY"
          fi
