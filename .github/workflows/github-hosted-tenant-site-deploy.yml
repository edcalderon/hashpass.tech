name: GitHub-hosted tenant site build and deploy

on:
  push:
    branches: [develop, main]
    paths:
      - 'apps/mobile-app/**'
      - 'packages/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.nvmrc'
      - '.github/workflows/github-hosted-tenant-site-deploy.yml'
  workflow_dispatch:
    inputs:
      target:
        description: Target (development targets require develop; production targets require main)
        type: choice
        options: [cbweek-development, bsl-development, production, bsl-production]
        default: cbweek-development
      deploy:
        description: Deploy the verified artifact
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  targets:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.targets.outputs.matrix }}
    steps:
      - id: targets
        env:
          BRANCH: ${{ github.ref_name }}
          TARGET: ${{ inputs.target }}
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const allowed = process.env.BRANCH === 'develop'
            ? ['cbweek-development', 'bsl-development']
            : process.env.BRANCH === 'main' ? ['production', 'bsl-production'] : [];
          const targets = process.env.TARGET ? [process.env.TARGET] : allowed;
          if (!targets.length || targets.some(target => !allowed.includes(target))) {
            throw new Error('Target does not match the protected source branch');
          }
          const include = targets.map(environment => ({
            environment,
            bsl: environment.startsWith('bsl-'),
            artifactPath: environment.startsWith('bsl-') ? 'apps/mobile-app/dist' : 'dist',
          }));
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `matrix=${JSON.stringify({ include })}\n`);
          NODE

  build:
    needs: targets
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.targets.outputs.matrix) }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    environment: ${{ matrix.environment }}
    concurrency:
      group: tenant-site-build-${{ matrix.environment }}-${{ github.ref }}
      cancel-in-progress: true
    env:
      PNPM_STORE_DIR: ${{ github.workspace }}/.pnpm-store
      NODE_MAX_OLD_SPACE_SIZE: '12288'
      EXPO_EXPORT_MAX_WORKERS: '1'
      BSL_BUILD_ONLY: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - run: pnpm config set store-dir "$PNPM_STORE_DIR"
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: pnpm
      - name: Load public target configuration
        env:
          PUBLIC_BUILD_ENV: ${{ vars.STATIC_SITE_PUBLIC_BUILD_ENV }}
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const config = JSON.parse(process.env.PUBLIC_BUILD_ENV || '{}');
          if (!Object.keys(config).length) throw new Error('Missing public target configuration');
          for (const [key, value] of Object.entries(config)) {
            if (!/^(EXPO_PUBLIC_[A-Z0-9_]+|NEXT_PUBLIC_[A-Z0-9_]+|BUILD_ENV|TARGET_STAGE|SITE_URL|FRONTEND_URL)$/.test(key)
                || /SECRET|SERVICE_ROLE|PASSWORD|PRIVATE/.test(key)
                || typeof value !== 'string' || /[\r\n]/.test(value)) {
              throw new Error(`Invalid public build setting: ${key}`);
            }
            fs.appendFileSync(process.env.GITHUB_ENV, `${key}=${value}\n`);
          }
          NODE
      - name: Build core or event site without AWS credentials
        if: '!matrix.bsl'
        run: bash packages/tools/scripts/build-static-site.sh
      - name: Build BSL site without AWS credentials
        if: matrix.bsl
        run: bash packages/tools/scripts/build-bsl-static-site.sh
      - uses: actions/upload-artifact@v4
        with:
          name: site-${{ matrix.environment }}
          path: ${{ matrix.artifactPath }}
          if-no-files-found: error
          retention-days: 1

  deploy:
    needs: [targets, build]
    if: github.event_name == 'push' || inputs.deploy == true
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.targets.outputs.matrix) }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: ${{ matrix.environment }}
    concurrency:
      group: static-site-deploy-${{ matrix.environment }}
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    env:
      AWS_REGION: us-east-2
      SITE_BUILD_DIR: ${{ matrix.bsl && 'dist' || 'dist/client' }}
      SITE_BUCKET_NAME: ${{ vars.STATIC_SITE_BUCKET }}
      SITE_CLOUDFRONT_DISTRIBUTION_ID: ${{ vars.STATIC_SITE_DISTRIBUTION_ID }}
      SITE_LAMBDA_FUNCTION_NAME: ${{ vars.STATIC_SITE_LAMBDA_FUNCTION }}
      SITE_LAMBDA_REGION: us-east-1
      SITE_API_VERSION_URL: ${{ vars.STATIC_SITE_API_VERSION_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
      - uses: actions/download-artifact@v4
        with:
          name: site-${{ matrix.environment }}
          path: dist
      - name: Configure deployment credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_STATIC_SITE_DEPLOY_ROLE_ARN }}
          allowed-account-ids: ${{ vars.AWS_TARGET_ACCOUNT_ID }}
          aws-region: us-east-2
          mask-aws-account-id: true
      - name: Deploy the verified artifact
        run: bash packages/tools/scripts/deploy-static-site.sh
      - name: Record deployment
        env:
          TARGET: ${{ matrix.environment }}
          REVISION: ${{ github.sha }}
        run: |
          printf 'Deployed %s from commit %s using standard GitHub-hosted compute.\n' "$TARGET" "$REVISION" >> "$GITHUB_STEP_SUMMARY"
