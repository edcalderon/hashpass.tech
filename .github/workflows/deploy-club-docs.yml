name: Deploy Club Pages

on:
  push:
    tags:
      - club-v*
    paths:
      - "apps/web-app/**"
      - "apps/docs/**"
      - "packages/infra/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".github/workflows/deploy-club-docs.yml"
  workflow_dispatch: {}

concurrency:
  group: club-pages-deploy
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    if: github.repository == 'hashpass-tech/hashpass.tech'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22.22.2"

      - name: Enable pnpm via Corepack
        run: |
          corepack enable
          corepack prepare "$(node -p "require('./package.json').packageManager")" --activate
          pnpm --version

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Build club and docs artifact
        env:
          # NEXT_PUBLIC_* vars are inlined at build time by `next build`'s
          # static export -- unset here means the deployed bundle literally
          # has no value baked in, not an empty string it could fall back
          # from. Missing entirely until 2026-08-16: apps/web-app's
          # SessionProvider (added 2026-08-15, mounted app-wide in
          # app/layout.tsx) calls supabaseClient() unconditionally on every
          # page's first render, which throws synchronously without these,
          # taking down the whole site -- not just the auth-gated parts.
          # Points at core-production (fxgftanraszjjyeidvia), matching the
          # project mobile's core-production profile resolves to, since
          # real club visitors must authenticate against the real database.
          NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
        run: pnpm --filter @hashpass/infra run build:club-docs-site

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .site-artifacts/club-docs

  deploy:
    if: github.repository == 'hashpass-tech/hashpass.tech'
    needs: build
    runs-on: ubuntu-latest
    environment:
      # Use a dedicated Pages environment so tag-triggered club releases are not
      # blocked by the repo's branch-restricted github-pages policy.
      name: club-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
