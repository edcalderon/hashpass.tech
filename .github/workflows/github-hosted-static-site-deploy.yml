name: GitHub-hosted static site build and deploy

on:
  workflow_dispatch:
    inputs:
      deploy:
        description: Deploy the development artifact (build-only by default)
        required: true
        default: false
        type: boolean

concurrency:
  group: static-site-deploy-development
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build static site (development)
    runs-on: ubuntu-latest
    env:
      BUILD_ENV: dev
      EXPO_PUBLIC_SUPABASE_URL: ${{ vars.EXPO_PUBLIC_SUPABASE_URL_DEV }}
      EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ vars.EXPO_PUBLIC_SUPABASE_ANON_KEY_DEV }}
      EXPO_PUBLIC_SUPABASE_KEY: ${{ vars.EXPO_PUBLIC_SUPABASE_ANON_KEY_DEV }}
      EXPO_PUBLIC_BSL_SUPABASE_URL: ${{ vars.EXPO_PUBLIC_BSL_SUPABASE_URL_DEV }}
      EXPO_PUBLIC_BSL_SUPABASE_KEY: ${{ vars.EXPO_PUBLIC_BSL_SUPABASE_KEY_DEV }}
      NODE_MAX_OLD_SPACE_SIZE: '12288'
      EXPO_EXPORT_MAX_WORKERS: '1'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.5

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22.22.2'
          cache: pnpm

      - name: Build the static site
        run: bash packages/tools/scripts/build-static-site.sh

      - name: Upload static site artifact
        uses: actions/upload-artifact@v4
        with:
          name: static-site-development
          path: dist/client
          if-no-files-found: error
          retention-days: 1

  deploy:
    name: Deploy static site (development)
    needs: build
    if: inputs.deploy == true
    runs-on: ubuntu-latest
    environment: development
    permissions:
      contents: read
      id-token: write
    env:
      AWS_REGION: us-east-2
      SITE_BUILD_DIR: dist/client
      SITE_BUCKET_NAME: dev.hashpass.tech
      SITE_CLOUDFRONT_DISTRIBUTION_ID: E1Y06KG5U6MKCS
      SITE_LAMBDA_FUNCTION_NAME: hashpass-dev-expo-router-api
      SITE_LAMBDA_REGION: us-east-1
      SITE_API_VERSION_URL: https://api-dev.hashpass.tech/api/config/versions
    steps:
      - name: Checkout deployment scripts
        uses: actions/checkout@v4

      - name: Download verified static site artifact
        uses: actions/download-artifact@v4
        with:
          name: static-site-development
          path: dist/client

      - name: Validate deployment role configuration
        env:
          ROLE_ARN: ${{ vars.AWS_STATIC_SITE_DEPLOY_ROLE_ARN }}
        run: |
          set -euo pipefail
          test -n "$ROLE_ARN" || {
            echo "AWS_STATIC_SITE_DEPLOY_ROLE_ARN is not configured for this repository."
            exit 1
          }

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_STATIC_SITE_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: hashpass-static-site-development

      - name: Deploy the verified static site
        run: bash packages/tools/scripts/deploy-static-site.sh
