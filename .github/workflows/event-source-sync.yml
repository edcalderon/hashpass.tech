name: Event source sync

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: event-source-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: develop
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 9.15.5
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.22.2
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: npm run sync:events
        env:
          EVENT_INGESTION_SUPABASE_URL: ${{ secrets.EVENT_INGESTION_SUPABASE_URL }}
          EVENT_INGESTION_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.EVENT_INGESTION_SUPABASE_SERVICE_ROLE_KEY }}
          EVENT_INGESTION_LEGACY_JSON_FALLBACK: "true"
      - name: Open snapshot update PR
        uses: peter-evans/create-pull-request@c5a7806660adbe173f04e3e038b0ccdcd758773c # v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: automation/event-source-sync
          base: develop
          delete-branch: true
          commit-message: "chore(events): sync public event sources"
          title: "chore(events): sync public event sources"
          body: |
            Automated refresh of validated public event-source data.

            - Source: PKRR / Hash Poker Room
            - Workflow: `${{ github.workflow }}`
            - Run: `${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}`
          add-paths: |
            packages/config/src/generated/ingested-events.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: event-source-sync
          path: |
            packages/config/src/generated/ingested-events.json
            artifacts/event-ingestion/health.json
          retention-days: 14
