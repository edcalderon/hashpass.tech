name: Mirror LocalPass to standalone repo

# Keeps https://github.com/hashpass-tech/localproof.org in sync with
# apps/localpass, for independent packaging/development outside this
# monorepo. Uses `git subtree split` so the mirror gets real, reviewable
# history (not a single squashed snapshot) with apps/localpass's own files
# promoted to the mirror's repo root.
#
# Deliberately a plain (non-force) push: if someone has committed directly
# to the mirror for independent development, a diverged `main` fails this
# push loudly instead of silently overwriting their work. Reconcile that by
# hand (e.g. merge the mirror's changes back into apps/localpass here first).

on:
  push:
    branches: [main]
    paths:
      - 'apps/localpass/**'
      - '.github/workflows/localpass-mirror.yml'
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: localpass-mirror
  cancel-in-progress: false

jobs:
  mirror:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout monorepo with full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Split apps/localpass into its own branch
        run: |
          git config user.name "hashpass-bot"
          git config user.email "bot@hashpass.tech"
          git subtree split --prefix=apps/localpass --branch mirror-export

      - name: Push split history to the standalone mirror
        env:
          MIRROR_TOKEN: ${{ secrets.LOCALPROOF_MIRROR_TOKEN }}
        run: |
          if [ -z "$MIRROR_TOKEN" ]; then
            echo "::error::LOCALPROOF_MIRROR_TOKEN is not set. Add a fine-grained PAT scoped only to hashpass-tech/localproof.org (Contents read/write) as a repo secret, then re-run this workflow." >&2
            exit 1
          fi
          echo "::add-mask::$MIRROR_TOKEN"
          git remote add mirror "https://x-access-token:${MIRROR_TOKEN}@github.com/hashpass-tech/localproof.org.git"
          git push mirror mirror-export:main
