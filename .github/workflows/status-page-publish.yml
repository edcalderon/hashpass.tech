name: Publish status page

# Builds https://work.hashpass.tech/status from the same generator as the Plane "HASHPASS Mission Command Center"
# page and writes it to the VPS through SSM. The page is static, so nothing runs on the VPS between publishes.
on:
  schedule:
    - cron: '17 * * * *'
  push:
    branches: [main]
    paths:
      - 'packages/tools/scripts/mission-control-page.mjs'
      - 'packages/tools/scripts/build-status-page.mjs'
      - '.github/workflows/status-page-publish.yml'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: status-page-publish
  cancel-in-progress: true

jobs:
  publish:
    name: Build and publish the status page
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    env:
      GH_TOKEN: ${{ github.token }}
      AWS_REGION: ${{ vars.SELF_HOSTED_VPS_AWS_REGION }}
      SSM_MANAGED_INSTANCE_ID: ${{ vars.SELF_HOSTED_VPS_SSM_MANAGED_INSTANCE_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Build the page
        run: node packages/tools/scripts/build-status-page.mjs --out dist/status/index.html

      - name: Refuse an empty or private-looking page
        run: |
          set -euo pipefail
          test "$(wc -c < dist/status/index.html)" -gt 5000
          grep -q 'Company directory' dist/status/index.html
          ! grep -q 'Open company work' dist/status/index.html

      - name: Configure AWS credentials with OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ vars.SELF_HOSTED_VPS_AWS_REGION }}
          role-to-assume: ${{ vars.SELF_HOSTED_VPS_DEPLOY_ROLE_ARN }}
          role-session-name: hashpass-status-page-publish
          mask-aws-account-id: true

      - name: Write the page to the VPS
        run: |
          set -euo pipefail
          echo "::add-mask::${SSM_MANAGED_INSTANCE_ID}"
          payload="$(base64 -w0 dist/status/index.html)"
          remote="install -d -m 0755 /opt/hashpass/status && echo ${payload} | base64 -d > /opt/hashpass/status/index.html.tmp && chmod 0644 /opt/hashpass/status/index.html.tmp && mv /opt/hashpass/status/index.html.tmp /opt/hashpass/status/index.html"
          parameters_file="$(mktemp)"
          trap 'rm -f "$parameters_file"' EXIT
          jq -n --arg command "$remote" '{commands: [$command]}' > "$parameters_file"
          command_id="$(aws ssm send-command \
            --region "$AWS_REGION" \
            --instance-ids "$SSM_MANAGED_INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --comment "Publish status page ${GITHUB_SHA}" \
            --parameters "file://${parameters_file}" \
            --query 'Command.CommandId' --output text)"
          aws ssm wait command-executed --region "$AWS_REGION" --command-id "$command_id" --instance-id "$SSM_MANAGED_INSTANCE_ID"

      - name: Verify the live page
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location --retry 5 --retry-delay 5 --max-time 20 https://work.hashpass.tech/status | grep -q 'HASHPASS status'
