name: Publish status page

# Builds https://work.hashpass.tech/status from the same generator as the Plane "HASHPASS Mission Command Center"
# page and writes it to the VPS through SSM. The page is static, so nothing runs on the VPS between publishes.
on:
  schedule:
    - cron: '17 * * * *'
  push:
    branches: [main]
    tags: ['status-v*.*.*']
    paths:
      - 'packages/tools/scripts/mission-control-page.mjs'
      - 'packages/tools/scripts/build-status-page.mjs'
      - 'packages/tools/scripts/release-status-page.mjs'
      - 'apps/status-page/**'
      - 'package.json'
      - '.github/workflows/status-page-publish.yml'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: status-page-publish
  cancel-in-progress: true

jobs:
  publish:
    name: Build and publish the status page
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/status-v')
    runs-on: ubuntu-latest
    environment: production
    env:
      GH_TOKEN: ${{ github.token }}
      AWS_REGION: ${{ vars.SELF_HOSTED_VPS_AWS_REGION }}
      SSM_MANAGED_INSTANCE_ID: ${{ vars.SELF_HOSTED_VPS_SSM_MANAGED_INSTANCE_ID }}
      EXPECTED_AWS_ACCOUNT_ID: ${{ vars.SELF_HOSTED_VPS_AWS_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Use the latest independent status release for scheduled publishes
        if: github.event_name == 'schedule'
        run: |
          set -euo pipefail
          git fetch --force --tags origin
          latest_tag="$(git tag --list 'status-v*.*.*' --sort=-v:refname | head -n1)"
          if [ -z "$latest_tag" ]; then
            echo "No independent status release tag exists yet; keeping the scheduled source at main."
            exit 0
          fi
          echo "Scheduled publish source: $latest_tag"
          git checkout --detach "$latest_tag"

      - name: Build the page
        env:
          MISSION_CONTROL_METRICS_URL: ${{ vars.MISSION_CONTROL_METRICS_URL }}
          MISSION_CONTROL_METRICS_TOKEN: ${{ secrets.MISSION_CONTROL_METRICS_TOKEN }}
        run: node packages/tools/scripts/build-status-page.mjs --out dist/status/index.html

      - name: Refuse an empty or private-looking page
        run: |
          set -euo pipefail
          test "$(wc -c < dist/status/index.html)" -gt 5000
          grep -q 'Company directory' dist/status/index.html
          ! grep -q 'Open company work' dist/status/index.html
          test -s dist/status/status-page.js
          test -s dist/status/status-version.json

      - name: Configure AWS credentials with OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ vars.SELF_HOSTED_VPS_AWS_REGION }}
          role-to-assume: ${{ vars.SELF_HOSTED_VPS_DEPLOY_ROLE_ARN }}
          role-session-name: hashpass-status-page-publish
          mask-aws-account-id: true

      - name: Verify assumed AWS account
        run: |
          set -euo pipefail
          [[ -n "$EXPECTED_AWS_ACCOUNT_ID" && -n "$SSM_MANAGED_INSTANCE_ID" ]] || {
            echo '::error::SELF_HOSTED_VPS_AWS_ACCOUNT_ID and SELF_HOSTED_VPS_SSM_MANAGED_INSTANCE_ID must be configured.'
            exit 1
          }
          echo "::add-mask::${EXPECTED_AWS_ACCOUNT_ID}"
          caller_account="$(aws sts get-caller-identity --query 'Account' --output text)"
          echo "::add-mask::${caller_account}"
          [[ "$caller_account" == "$EXPECTED_AWS_ACCOUNT_ID" ]] || {
            echo '::error::The assumed AWS account does not match the configured deployment target.'
            exit 1
          }

      - name: Write the page to the VPS
        run: |
          set -euo pipefail
          echo "::add-mask::${SSM_MANAGED_INSTANCE_ID}"
          tar -C dist/status -czf dist/status-page.tgz index.html status-page.js status-version.json
          payload="$(base64 -w0 dist/status-page.tgz)"
          remote="install -d -m 0755 /opt/hashpass/status && echo ${payload} | base64 -d > /tmp/hashpass-status.tgz && tar -xzf /tmp/hashpass-status.tgz -C /opt/hashpass/status && chmod 0644 /opt/hashpass/status/index.html /opt/hashpass/status/status-page.js /opt/hashpass/status/status-version.json && rm -f /tmp/hashpass-status.tgz"
          parameters_file="$(mktemp)"
          trap 'rm -f "$parameters_file"' EXIT
          jq -n --arg command "$remote" '{commands: [$command]}' > "$parameters_file"
          command_id="$(aws ssm send-command \
            --region "$AWS_REGION" \
            --instance-ids "$SSM_MANAGED_INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --comment "Publish status page ${GITHUB_SHA}" \
            --parameters "file://${parameters_file}" \
            --query 'Command.CommandId' --output text)"
          aws ssm wait command-executed --region "$AWS_REGION" --command-id "$command_id" --instance-id "$SSM_MANAGED_INSTANCE_ID"

      - name: Verify the live page
        run: |
          set -euo pipefail
          # The page is private. An anonymous request must be sent to sign-in and must not receive any page content;
          # retry because the gateway and Caddy roll out separately from this job.
          for attempt in 1 2 3 4 5 6; do
            headers="$(mktemp)"
            body="$(mktemp)"
            code="$(curl --silent --show-error --max-time 20 --dump-header "$headers" --output "$body" --write-out '%{http_code}' https://work.hashpass.tech/status || true)"
            location="$(grep -i '^location:' "$headers" | tr -d '\r' | head -n1 || true)"
            leaked=false
            grep -q 'HASHPASS status' "$body" && leaked=true
            if [ "$leaked" = true ]; then
              echo "::error::The status page is served without sign-in"
              exit 1
            fi
            if [ "$code" = 302 ] && echo "$location" | grep -qi '/status/login'; then
              echo "Anonymous /status redirects to sign-in"
              exit 0
            fi
            echo "Attempt $attempt: HTTP $code, not yet gated; waiting for the deploy"
            sleep 10
          done
          echo "::error::Anonymous /status did not redirect to /status/login"
          exit 1
