<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="720" viewBox="0 0 1600 720" role="img" aria-labelledby="title desc"><title id="title">OpenProof architecture</title><desc id="desc">Attendance flows from organizer QR verification through HashPass into Arkiv, an attendee wallet, and an independent verifier.</desc><rect width="1600" height="720" fill="#050812"/><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0l8 4-8 4z" fill="#71809b"/></marker></defs><text x="90" y="90" fill="#4dd8ff" font-family="monospace" font-size="18" letter-spacing="3">HASHPASS OPENPROOF / ARKIV IDEATHON</text><text x="90" y="145" fill="#f7f9ff" font-family="sans-serif" font-weight="700" font-size="38">A portable, queryable attendance credential layer</text><g font-family="sans-serif"> 
<g fill="none" stroke="#71809b" stroke-width="3" marker-end="url(#a)"><path d="M260 340h60"/><path d="M500 340h60"/><path d="M740 340h60"/><path d="M980 340h60"/><path d="M1220 340h60"/></g>
<g><rect x="80" y="260" width="180" height="160" rx="18" fill="#0b1724" stroke="#4dd8ff"/><text x="110" y="300" fill="#4dd8ff" font-size="14">01 / PRIVATE</text><text x="110" y="350" fill="white" font-size="22" font-weight="700">Organizer</text><text x="110" y="382" fill="#9aa7bd" font-size="15">QR check-in</text></g>
<g><rect x="320" y="260" width="180" height="160" rx="18" fill="#171326" stroke="#f4bd68"/><text x="350" y="300" fill="#f4bd68" font-size="14">02 / 7 DAYS</text><text x="350" y="350" fill="white" font-size="22" font-weight="700">Receipt</text><text x="350" y="382" fill="#9aa7bd" font-size="15">Temporary proof</text></g>
<g><rect x="560" y="260" width="180" height="160" rx="18" fill="#171326" stroke="#8b7cff"/><text x="590" y="300" fill="#8b7cff" font-size="14">03 / HASHPASS</text><text x="590" y="350" fill="white" font-size="22" font-weight="700">Verification</text><text x="590" y="382" fill="#9aa7bd" font-size="15">Signed claim</text></g>
<g><rect x="800" y="240" width="180" height="200" rx="18" fill="#15132c" stroke="#8b7cff" stroke-width="2"/><text x="830" y="285" fill="#8b7cff" font-size="14">04 / PUBLIC</text><text x="830" y="335" fill="white" font-size="21" font-weight="700">Arkiv</text><text x="830" y="368" fill="#9aa7bd" font-size="14">AttendanceClaim</text><text x="830" y="400" fill="#68e0ad" font-family="monospace" font-size="13">$creator · $owner</text></g>
